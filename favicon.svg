<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navy rounded-square background — matches --navy from index.html -->
  <rect width="64" height="64" rx="12" fill="#1a2856"/>
  <!-- Tower: tapered, white -->
  <polygon points="30,30 34,30 35,58 29,58" fill="#ffffff"/>
  <!-- 3 blades: 120° apart, white, tapered teardrop -->
  <g transform="translate(32 28)">
    <path d="M 0 0 Q -1 -12 1 -24 Q 3 -12 1 -2 Z" fill="#ffffff"/>
    <g transform="rotate(120)"><path d="M 0 0 Q -1 -12 1 -24 Q 3 -12 1 -2 Z" fill="#ffffff"/></g>
    <g transform="rotate(240)"><path d="M 0 0 Q -1 -12 1 -24 Q 3 -12 1 -2 Z" fill="#ffffff"/></g>
    <!-- Hub: brand green (--green from index.html) -->
    <circle r="4.5" fill="#5CC660"/>
  </g>
</svg>
